<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Clean Case </title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">
        <h1>Clean Case</h1>
        <p class="subtitle">TransformaTexto - Insira seu texto e modifique o formato instantaneamente</p>

        <!-- Entrada de Texto -->
        <div class="group">
            <label for="inputText">Texto de Entrada:</label>
            <textarea id="inputText" placeholder="Cole ou digite seu texto aqui..."></textarea>
        </div>

        <!-- Seção de Botões -->
        <div class="group">
            <label>Transformar para:</label>
            <div class="buttons-section">
                <button class="btn-case" onclick="convertText('snake_case')">snake_case</button>
                <button class="btn-case" onclick="convertText('kebab-case')">kebab-case</button>
                <button class="btn-case" onclick="convertText('CONSTANT_CASE')">CONSTANT_CASE</button>
                <button class="btn-case" onclick="convertText('camelCase')">camelCase</button> <!--Today--> 
                <button class="btn-case" onclick="convertText('PascalCase')">PascalCase</button>
                <button class="btn-case" onclick="convertText('Pascal_Snake_Case')">Pascal_Snake_Case</button>
                <button class="btn-case" onclick="convertText('dot.case')">dot.case</button>
                <button class="btn-case" onclick="convertText('Train-Case')">Train-Case</button>
                <button class="btn-case" onclick="convertText('sWAP_cASE')">sWAP cASE</button>
                <button class="btn-case" onclick="convertText('Sentence_case')">Sentence case</button>
                <button class="btn-case" onclick="convertText('path/case')">path/case</button>
                <button class="btn-case" onclick="convertText('Capital_Case')">Capital Case</button> 
                <button class="btn-case" onclick="convertText('UPPERCASE')">UPPERCASE</button>
                <button class="btn-case" onclick="convertText('lowercase')">lowercase</button> 
            </div>
        </div>

        <!-- Saída de Texto Modificado -->
        <div class="group">
            <label>Texto Modificado:</label>
            <div class="output-container">
                <div id="outputText" class="output-text">O resultado aparecerá aqui...</div>
                <button id="btnCopy" class="btn-copy" onclick="copyToClipboard()">
                    <span>Copiar</span>
                </button>
            </div>
            
            <!-- Botão Limpar posicionado abaixo do texto modificado -->
            <div class="action-footer">
                <div id="charCounter" class="char-counter">Caracteres: 0</div>
                <button class="btn-clear" onclick="clearFields()">Limpar</button>
            </div>

        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
