<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Unidades Policiais</title>
  <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Unidades PCPE</h1>
      <p class="subtitle">Digite o nome ou parte do nome da unidade policial</p>
    </header>
    
    <div class="search-container">
      <input type="text" id="inputPesquisa" placeholder="Ex: Delegacia, Regional..." autocomplete="on">
    </div>

    <div id="resultados">
      <div class="status-msg">Digite algo para iniciar a pesquisa.</div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
